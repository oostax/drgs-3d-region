name: Verify analytics for publication

on:
  push:
    branches: [fix/map-appearance-0ebf9ae]
    paths: [.github/workflows/publish-analytics-verified.yml]

permissions:
  contents: write

concurrency:
  group: analytics-candidate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      ATLAS_DADATA_TOKEN: ''
      ATLAS_ANALYTICS_FIXTURE: /tmp/atlas-analytics-fixture
      ATLAS_BROWSER_OUTPUT: /tmp/analytics-recheck/browser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Recover the reviewed source without changing master
        run: |
          set -euo pipefail
          mkdir -p /tmp/analytics-recheck
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          BASE=$(git rev-parse origin/master)
          test "$BASE" = '9ee506a757842d9c0ec5807e6f608b6a69cfe7be'
          echo "$BASE" > /tmp/analytics-recheck/base.txt
          git merge --no-edit origin/master
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/analytics-patch-{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a546b58b31a7a816689eefae0d87a302b9acd68847da8db76fc683f2e7c30fb0'
          Path('/tmp/analytics.patch').write_bytes(patch)
          PY
          git apply --index /tmp/analytics.patch
          git apply --index .github/analytics-fixes.patch
          # The runtime and test scripts are published separately from workflow
          # administration. Keep every workflow exactly as in this branch.
          git restore --source=HEAD --staged --worktree -- .github
          git diff --check
          git diff --cached --check
          git diff --cached --stat > /tmp/analytics-recheck/changes.txt
      - run: npm ci
      - name: Unit and API regressions including marker visibility
        run: npm test 2>&1 | tee /tmp/analytics-recheck/tests.log
      - name: TypeScript
        run: npm run typecheck 2>&1 | tee /tmp/analytics-recheck/typecheck.log
      - name: Production build
        run: npm run build 2>&1 | tee /tmp/analytics-recheck/build.log
      - run: python3 -m pip install playwright==1.55.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Prepare isolated synthetic data
        run: node_modules/.bin/tsx scripts/prepare-analytics-fixture.ts "$ATLAS_ANALYTICS_FIXTURE"
      - name: Repeat real client-group clicks, pagination and responsive analytics
        env:
          ATLAS_DATA_ROOT: /tmp/atlas-analytics-fixture
          ATLAS_DB: /tmp/atlas-analytics-fixture/private.sqlite
          ATLAS_LIVE_DB: /tmp/atlas-analytics-fixture/absent-live.sqlite
        run: |
          set -euo pipefail
          mkdir -p "$ATLAS_BROWSER_OUTPUT"
          npm start > "$ATLAS_BROWSER_OUTPUT/server.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3200/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$ATLAS_BROWSER_OUTPUT/server.log"; exit 1; fi
          python3 scripts/verify-analytics.py 2>&1 | tee "$ATLAS_BROWSER_OUTPUT/browser.log"
      - name: Retain the verified source on the existing review branch
        run: |
          set -euo pipefail
          test -z "$(git diff --cached --name-only -- .github)"
          git diff --cached --check
          git commit -m 'feat: verified territorial analytics and complete client portfolio'
          git rev-parse HEAD > /tmp/analytics-recheck/candidate.txt
          git rev-parse HEAD^{tree} > /tmp/analytics-recheck/tree.txt
          git archive --format=tar.gz HEAD src tests scripts docs .env.example package.json package-lock.json next.config.ts > /tmp/analytics-recheck/verified-source.tar.gz
          git push origin HEAD:refs/heads/fix/map-appearance-0ebf9ae
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-overlap-recheck
          path: /tmp/analytics-recheck
          retention-days: 7
