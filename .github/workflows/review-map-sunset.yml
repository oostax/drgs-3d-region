name: Verify map modes and sunset
on:
  push:
    branches: [fix/map-appearance-0ebf9ae]
permissions:
  contents: write
jobs:
  verify:
    if: >-
      github.event.head_commit.message == 'ci: verify map modes and sunset candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: mkdir -p /tmp/map-appearance-review
      - run: npm ci
      - name: Read installed client guidance and apply exact reviewed replacements
        run: |
          find node_modules/next/dist/docs -iname '*use-client*' -type f -exec cat {} \; > /tmp/map-appearance-review/next-client-guide.log
          python3 .github/review-map.py
          git diff --check
      - name: All tests
        run: npm test 2>&1 | tee /tmp/map-appearance-review/tests.log
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee /tmp/map-appearance-review/typecheck.log
      - name: Production build
        run: npm run build 2>&1 | tee /tmp/map-appearance-review/build.log
      - name: Record verified candidate source
        run: |
          git add src/components/Atlas.tsx src/components/AtlasMap.tsx src/lib/building-materials.ts src/lib/map-appearance.ts src/lib/map-landmarks.ts src/lib/map-life.ts src/lib/map-signal-scenes.ts src/lib/map-solar-light.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: verified neutral sunset lighting and deterministic 2D/3D modes'
          git push origin HEAD:fix/map-appearance-0ebf9ae
          git rev-parse HEAD > /tmp/map-appearance-review/commit.txt
          git archive HEAD src tests scripts/verify-map-modes.mjs | gzip > /tmp/map-appearance-review/source.tar.gz
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/atlas-browser --no-package-lock playwright@1.57.0
          /tmp/atlas-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual React UI and WebGL mode cycles with synthetic map fixtures
        env:
          PLAYWRIGHT_MODULE: /tmp/atlas-browser/node_modules/playwright/index.mjs
          ATLAS_BROWSER_OUTPUT: /tmp/map-appearance-review/browser
        run: |
          npm start > /tmp/map-appearance-review/server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3200/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-map-modes.mjs 2>&1 | tee /tmp/map-appearance-review/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-appearance-review
          path: /tmp/map-appearance-review
          retention-days: 3
