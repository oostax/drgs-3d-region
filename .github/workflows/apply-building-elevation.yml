name: Apply verified building fix
on:
  push:
    branches: [fix/building-elevation]
    paths: [.github/workflows/apply-building-elevation.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/building-elevation'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/building-elevation
          fetch-depth: 0
      - name: Verify patch and integration script
        run: |
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          name = '.github/building-elevation.patch.zlib.b64'
          paths = [Path(name)] + [Path(name + '.' + str(i)) for i in range(1, 5)]
          patch = zlib.decompress(base64.b64decode(''.join(path.read_text().strip() for path in paths), validate=True))
          assert len(patch) == 45409
          assert hashlib.sha256(patch).hexdigest() == '327dab9b44b69cc82c64ae3d2dbbc6a0c8c9c5f4496f0ae9605293e04cd5b95f'
          Path('/tmp/building-elevation.patch').write_bytes(patch)
          script = zlib.decompress(base64.b64decode(Path('.github/integrate-buildings.py.zlib.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(script).hexdigest() == '36c6a6884204fba14796da3bc49d111d93ca0cb29e1dc3dd2f17e93479f43bcf'
          Path('/tmp/integrate-buildings.py').write_bytes(script)
          PY
      - name: Integrate and publish only the reviewed code files
        run: |
          git merge-base --is-ancestor 1d5dfc65a7204a0216c7907e2746b11b449bea24 HEAD
          python3 /tmp/integrate-buildings.py
          git add README.md src/components/AtlasMap.tsx src/lib/building-detail-geometry.ts src/lib/building-materials.ts src/lib/building-elevation.ts src/lib/building-terrain.ts src/lib/map-building-details.ts tests/building-architecture-integration.test.ts tests/building-materials.test.ts tests/building-elevation.test.ts tests/building-terrain.test.ts
          git diff --cached --check
          git rm .github/building-elevation.patch.zlib.b64 .github/building-elevation.patch.zlib.b64.{1,2,3,4} .github/integrate-buildings.py.zlib.b64
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: align buildings, roofs and foundations with adaptive terrain grounding'
          git push origin HEAD:refs/heads/fix/building-elevation
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
