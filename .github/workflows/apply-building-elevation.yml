name: Apply verified building fix
on:
  push:
    branches: [fix/building-elevation]
    paths: [.github/workflows/apply-building-elevation.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/building-elevation'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/building-elevation
          fetch-depth: 0
      - name: Decode and verify the locally tested patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          name = '.github/building-elevation.patch.zlib.b64'
          paths = [Path(name)] + [Path(name + '.' + str(i)) for i in range(1, 5)]
          payload = ''.join(path.read_text().strip() for path in paths)
          patch = zlib.decompress(base64.b64decode(payload, validate=True))
          assert len(patch) == 45409
          assert hashlib.sha256(patch).hexdigest() == '327dab9b44b69cc82c64ae3d2dbbc6a0c8c9c5f4496f0ae9605293e04cd5b95f'
          Path('/tmp/building-elevation.patch').write_bytes(patch)
          PY
      - name: Apply only to the original project ancestry
        run: |
          git merge-base --is-ancestor 1d5dfc65a7204a0216c7907e2746b11b449bea24 HEAD
          git apply --check --index /tmp/building-elevation.patch
          git apply --index /tmp/building-elevation.patch
          git diff --cached --check
          git rm .github/building-elevation.patch.zlib.b64 .github/building-elevation.patch.zlib.b64.{1,2,3,4} .github/workflows/apply-building-elevation.yml
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: keep building heights, roofs and terrain placement consistent'
          git push origin HEAD:refs/heads/fix/building-elevation
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
