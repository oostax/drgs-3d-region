<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Архитектура Татарстана · Атлас</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e7ece4;color:#294a40;font-family:system-ui,sans-serif}header{padding:22px 32px 18px;border-bottom:1px solid #b7c9bb;display:flex;justify-content:space-between;align-items:baseline}h1{font:32px Georgia,serif;margin:0}header p{font-size:12px;letter-spacing:.03em;margin:0}#gallery{display:grid;grid-template-columns:repeat(4,1fr)}.panel{height:340px;position:relative;border-right:1px solid #c4d1c4;border-bottom:1px solid #c4d1c4;touch-action:none;cursor:grab}.panel:active{cursor:grabbing}.label{position:absolute;bottom:18px;left:22px;right:12px;pointer-events:none}h2{font:23px Georgia,serif;margin:0 0 5px}.meta{font-size:11px;opacity:.7}.number{position:absolute;left:22px;top:18px;font-size:11px;letter-spacing:.12em;opacity:.5}canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none}footer{padding:18px 32px;font-size:11px;line-height:1.7;color:#547064}@media(max-width:900px){#gallery{grid-template-columns:repeat(2,1fr)}.panel{height:310px}header{display:block}header p{margin-top:10px}}@media(max-width:520px){#gallery{grid-template-columns:1fr}.panel{height:370px}header{padding:22px}h1{font-size:27px}}a{color:inherit}

<body><canvas id="canvas"></canvas><header><h1>Архитектура Татарстана</h1><p>Поверните модель · Приблизьте колесом или жестом</p></header><main id="gallery"></main><footer>Авторские геометрические модели. Декоративные пропорции приблизительны. Координаты зданий проверены по OpenStreetMap.<br>Страница просмотра моделей; модели содержат реальные объёмные арки, колонны, купола и фасады.</footer><script type="module" src="/models/preview.js"></script></body></html>
