<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сбер Атлас — архитектура зданий</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e9e2;color:#243c32;font-family:system-ui,sans-serif}header{padding:28px 32px 12px;position:relative;z-index:2}h1{font-size:25px;letter-spacing:-.025em;margin:0 0 8px}p{max-width:950px;margin:0;color:#607068;font-size:14px;line-height:1.5}nav{display:flex;gap:8px;margin-top:16px}button{font:inherit;border:1px solid #bbc7bc;border-radius:8px;padding:9px 18px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#245b45;color:#fff;border-color:#245b45}#catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 24px 30px}article{min-width:0;height:310px}h2 a{color:inherit;text-decoration:none}h2 a:hover{text-decoration:underline}.focus #catalog{grid-template-columns:1fr}.focus article{height:calc(100vh - 220px)}.focus .preview{height:calc(100vh - 260px)}h2{position:relative;z-index:2;text-align:center;font-size:14px;font-weight:550;margin:0}.preview{height:276px}#catalog-canvas{position:fixed;inset:0;pointer-events:none;z-index:1}.night{background:#273438;color:#edf1e8}.night p{color:#b5c4bf}.night button{border-color:#657b74}.night button[aria-pressed=true]{background:#dfe8df;color:#234638}@media(min-width:1450px){#catalog{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){header{padding:20px}#catalog{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 8px}article{height:190px}.preview{height:163px}}
</style></head><body><header><h1>Архитектура зданий</h1><p>32 семейства фасадов. Реальная геометрия крыш, карнизов и балконов из слоя карты. Это условные образцы архитектурной стилизации, а не реконструкции конкретных домов.</p><nav aria-label="Освещение"><a href="./" style="color:inherit;padding:9px 12px">Все типы</a><button data-hour="12" aria-pressed="true">День</button><button data-hour="0" aria-pressed="false">Ночь</button></nav></header><main id="catalog"></main><script type="module" src="./preview.js"></script></body></html>
